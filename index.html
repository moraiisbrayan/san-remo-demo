<style>
/* Layout: protótipo de app em uma tela, fiel ao app San Remo (branco + amarelo, navegação inferior). Tela cheia no celular, moldura de telefone no desktop. */
:root{
  --bg:#ffffff;
  --page:#f4f1e8;
  --ink:#141414;
  --muted:#8a8a8a;
  --line:#efefef;
  --soft:#f6f6f6;
  --yellow:#f8c42c;
  --yellow-soft:#fde58f;
  --yellow-tint:#fff7d9;
  --green:#16a34a;
  --green-tint:#e8f8ee;
  --dark:#1a1a1a;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--page);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px;
  display:flex;justify-content:center;align-items:center;box-sizing:border-box;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.phone{
  width:390px;max-width:100%;height:min(844px,100%);
  background:var(--bg);border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 0 0 10px #111,0 30px 60px rgba(0,0,0,.25);
  display:flex;flex-direction:column;
}
@media (max-width:520px){
  body{background:var(--bg);padding-block:0}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}

.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:20px 22px 120px;background:var(--bg);
  animation:in .35s ease}
.screen.no-nav{padding-bottom:28px}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.pop,.scanline,.spin{animation:none!important}}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px}
.hello{display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:-.02em}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;
  font-weight:700;font-size:16px;color:#5a4300;box-shadow:0 0 0 4px var(--yellow-tint)}
.bell{width:24px;height:24px;color:var(--yellow)}
.back{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.back svg{width:24px;height:24px}

.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-weight:600}
.eyebrow.gray{color:var(--muted)}

/* mesa card */
.mesa{border-radius:28px;padding:22px;background:linear-gradient(140deg,#ffd84d,#f6b81c);
  color:#2a2000;position:relative;overflow:hidden;margin-bottom:18px}
.mesa::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:rgba(255,255,255,.22)}
.mesa .row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.65);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.08em}
.mesa .total{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:14px 0 2px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.mesa .sub{font-size:13.5px;opacity:.8;position:relative;z-index:1}
.mesa .cta{margin-top:18px;width:100%;background:var(--dark);color:#fff;border-radius:999px;padding:16px;

.card{background:var(--bg);border-radius:24px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.06);border:1px solid #fafafa}
.pts{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}

.bar{height:8px;border-radius:9px;background:#ececec;margin:14px 0 8px;overflow:hidden}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 22px}
.quick div{background:var(--yellow-soft);border-radius:999px;padding:16px 18px;font-weight:700;font-size:13px;letter-spacing:.04em;line-height:1.25;display:flex;align-items:center;gap:10px}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}

.mov{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.mov .ic{width:44px;height:44px;border-radius:50%;background:var(--green-tint);color:var(--green);display:grid;place-items:center;flex:none}

.mov .t{flex:1;min-width:0}
.mov .t b{display:block;font-size:15px;font-weight:600}

.mov .v{text-align:right;color:var(--green);font-weight:700;font-size:16px}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:30px 30px 0 0;
  box-shadow:0 -6px 24px rgba(0,0,0,.05);display:grid;grid-template-columns:repeat(4,1fr);
  padding:12px 10px 14px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;font-weight:600;color:#b9b9b9}
.nav .pill{width:60px;height:36px;border-radius:999px;display:grid;place-items:center}
.nav svg{width:22px;height:22px}
.nav .on{color:var(--ink);font-weight:700}
.nav .on .pill{background:var(--yellow)}

/* scan */
.scan{border-radius:28px;background:radial-gradient(circle at 50% 40%,#4b4232,#16130e 75%);height:360px;position:relative;overflow:hidden;margin:6px 0 18px}
.frame{position:absolute;inset:60px 50px;border-radius:22px}
.frame i{position:absolute;width:38px;height:38px;border:4px solid var(--yellow)}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:20px}
.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:20px}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:20px}
.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:20px}
.comanda{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);width:150px;height:96px;border-radius:12px;
  background:linear-gradient(135deg,#ffd84d,#f2ae12);box-shadow:0 10px 30px rgba(0,0,0,.4);padding:12px;color:#2a2000;font-weight:800;font-size:11px;letter-spacing:.1em}
.comanda .n{font-size:26px;letter-spacing:-.02em;margin-top:14px}
.scanline{position:absolute;left:56px;right:56px;height:3px;background:var(--yellow);box-shadow:0 0 18px var(--yellow);top:70px;animation:sl 1.6s ease-in-out infinite alternate}
@keyframes sl{to{top:285px}}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan.live .comanda{display:none}
.scan .status{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#fff;font-size:13.5px;font-weight:600}

h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0 6px;text-wrap:balance;line-height:1.1}
p.lead{margin:0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.5}

/* conta */
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.qty{width:34px;height:34px;border-radius:12px;background:var(--yellow-tint);color:#8a6400;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.item .nm{flex:1;min-width:0;font-weight:600;font-size:15px}
.item .nm span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.item .pr{font-weight:700;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--muted)}
.sum.big{color:var(--ink);font-size:20px;font-weight:800;padding-top:12px}
.earn{display:flex;align-items:center;gap:12px;background:var(--yellow-tint);border-radius:18px;padding:14px 16px;margin:16px 0 20px;font-size:14px;font-weight:600}
.earn .coin{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:800;font-size:12px;color:#5a4300;flex:none}
.btn{width:100%;background:var(--yellow);color:#2a2000;border-radius:999px;padding:18px;font-weight:800;font-size:16px;box-shadow:0 10px 24px rgba(248,196,44,.35)}
.btn.dark{background:var(--dark);color:#fff;box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none;margin-top:10px}
.btn:disabled{opacity:.45;box-shadow:none}

/* métodos */
.method{width:100%;display:flex;align-items:center;gap:14px;padding:18px;border-radius:22px;border:2px solid var(--line);margin-bottom:12px;text-align:left;background:var(--bg)}
.method .mi{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.method .mi svg{width:24px;height:24px}
.method .mt{flex:1;min-width:0}
.method .mt b{display:block;font-size:16px}
.method .mt span{font-size:12.5px;color:var(--muted)}
.method .radio{width:24px;height:24px;border-radius:50%;border:2px solid #d6d6d6;flex:none;display:grid;place-items:center}
.method.sel{border-color:var(--yellow);background:var(--yellow-tint)}
.method.sel .mi{background:var(--yellow)}
.method.sel .radio{border-color:var(--yellow);background:var(--yellow)}
.method.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.tag{display:inline-block;background:var(--green-tint);color:var(--green);font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}

/* pix */
.qr{width:220px;max-width:100%;margin:6px auto 16px;padding:14px;border-radius:24px;background:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.08)}
.qr svg{display:block;width:100%;height:auto}
.copy{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:12px 14px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.copy code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
.copy b{color:var(--ink);font-size:12px;letter-spacing:.08em}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:14px;color:var(--muted);margin:8px 0 18px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid #eee;border-top-color:var(--yellow);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.proc{height:100%;justify-content:center}
.bigspin{width:64px;height:64px;border-width:5px;margin-bottom:22px}

/* aprovado */
.ok{width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:20px auto 18px;box-shadow:0 0 0 12px var(--green-tint);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.ok svg{width:48px;height:48px;color:#fff}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.receipt{width:100%;background:var(--soft);border-radius:20px;padding:6px 18px;margin:18px 0}
.receipt .r{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #dedede;font-size:14px}
.receipt .r:last-child{border:0}
.receipt .r span{color:var(--muted)}
.receipt .r b{font-variant-numeric:tabular-nums}
.liberado{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:var(--green-tint);border-radius:20px;padding:16px;margin-bottom:18px}
.liberado .gi{width:46px;height:46px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.liberado .gi svg{width:26px;height:26px}
.liberado b{display:block;color:#0f3d22;font-size:15.5px}
.liberado span{font-size:13px;color:#2f6b45}

/* cartão de saída */
.exitcard{width:100%;border-radius:30px;padding:24px;background:linear-gradient(150deg,#1d1d1d,#000);color:#fff;position:relative;overflow:hidden;margin:6px 0 18px;text-align:left}
.exitcard::after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(248,196,44,.35),transparent 70%)}
.exitcard .brand{font-size:12px;letter-spacing:.2em;color:var(--yellow);font-weight:700}
.exitcard .num{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:22px 0 4px;font-variant-numeric:tabular-nums}
.exitcard .lbl{font-size:12px;color:#aaa;letter-spacing:.12em}
.status-pill{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:12.5px;letter-spacing:.1em;margin-top:22px;position:relative;z-index:1}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.timer{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--soft);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.timer b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.steps{width:100%;text-align:left;margin:4px 0 18px;padding:0;list-style:none;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;font-size:14px}
.steps li span{width:28px;height:28px;border-radius:50%;background:var(--yellow-tint);color:#8a6400;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}

.link{display:block;margin:14px auto 0;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
</style>

<script>
(function(){
  var ICON = {

    bell:'<svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
    gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 13h18M8 9c-2-3 1-6 4 0 3-6 6-3 4 0"/></svg>',
    trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
    pix:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 7.6 6.9a3 3 0 0 1 2.1.9L12 10.1l2.3-2.3a3 3 0 0 1 2.1-.9zM5.9 8.4 3 11.3a1 1 0 0 0 0 1.4l2.9 2.9h1.7a1.6 1.6 0 0 0 1.1-.5L11 12.8a1.4 1.4 0 0 1 2 0l2.3 2.3a1.6 1.6 0 0 0 1.1.5h1.7l2.9-2.9a1 1 0 0 0 0-1.4l-2.9-2.9h-1.7a1.6 1.6 0 0 0-1.1.5L13 11.2a1.4 1.4 0 0 1-2 0L8.7 8.9a1.6 1.6 0 0 0-1.1-.5zm1.7 8.7L12 21.5l4.4-4.4a3 3 0 0 1-2.1-.9L12 13.9l-2.3 2.3a3 3 0 0 1-2.1.9z"/></svg>',
    card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6 15h4"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    gate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21V5M20 21V5M4 9h7M13 9l5-3"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>'
  };

  var ITEMS = [
    {q:2,n:'Pão na chapa',d:'com requeijão',p:9.80},
    {q:1,n:'Café com leite',d:'grande',p:7.50},
    {q:1,n:'Misto quente',d:'pão de forma',p:14.90},
    {q:1,n:'Suco de laranja',d:'natural, 400 ml',p:10.70}
  ];
  var TOTAL = ITEMS.reduce(function(s,i){return s+i.p},0);
  var POINTS = Math.round(TOTAL);
  var MESA = '07', COMANDA = '0187';
  var state = {paid:false, method:'pix', points:61};
  var timers = [];
  var stream = null;

  function brl(v){return 'R$ '+v.toFixed(2).replace('.',',')}
  function clear(){timers.forEach(clearTimeout);timers=[];if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}if(window.__cd){clearInterval(window.__cd);window.__cd=null}}
  var root = document.getElementById('screens');
  var nav = document.getElementById('nav');

  function show(html, opts){
    clear();
    opts = opts||{};
    root.innerHTML = '<div class="screen'+(opts.nav?'':' no-nav')+(opts.cls?' '+opts.cls:'')+'">'+html+'</div>';
    nav.hidden = !opts.nav;
    root.firstChild.scrollTop = 0;
    root.querySelectorAll('[data-go]').forEach(function(b){
      b.addEventListener('click',function(){go(b.getAttribute('data-go'))});
    });
  }
  function backHdr(title,to){return '<div class="hdr"><button class="back" data-go="'+to+'">'+ICON.back+title+'</button></div>'}

  var screens = {
    home:function(){
      var mesa = state.paid
        ? '<div class="mesa paid"><div class="row"><span class="chip">MESA '+MESA+'</span><span class="chip">PAGA</span></div>'+
          '<div class="total">'+brl(TOTAL)+'</div><div class="sub">Pago pelo app · saída liberada</div>'+
          '<button class="cta" data-go="cartao">Ver cartão de saída</button></div>'
        : '<div class="mesa"><div class="row"><span class="chip">COMANDA ABERTA</span><span class="chip">MESA '+MESA+'</span></div>'+
          '<div class="total">'+brl(TOTAL)+'</div><div class="sub">5 itens · desde 10:32</div>'+
          '<button class="cta" data-go="scan">Pagar na mesa '+ICON.back.replace('M15 5l-7 7 7 7','M9 5l7 7-7 7').replace('<svg','<svg width="18" height="18"')+'</button></div>';
      var movs = (state.paid
        ? '<div class="mov new"><div class="ic">'+ICON.plus+'</div><div class="t"><b>Pagamento Mesa '+MESA+'</b><span>Hoje, agora</span></div><div class="v">+'+POINTS+' PTS<span>ACÚMULO</span></div></div>' : '')+
        '<div class="mov"><div class="ic">'+ICON.plus+'</div><div class="t"><b>San Remo Bônus</b><span>22 de abr., 13:18</span></div><div class="v">+8 PTS<span>ACÚMULO</span></div></div>';
      show(
        '<div class="hdr"><div class="hello"><span class="avatar">R</span>Olá, RAFAEL</div>'+ICON.bell+'</div>'+
        mesa+
        '<div class="card"><div class="eyebrow">Saldo total de pontos</div>'+
        '<div class="pts" style="margin-top:12px">'+state.points+'<small>PTS</small></div>'+
        '<div class="muted" style="margin-top:6px;font-size:15px">≈ R$ 0,00 em cashback</div>'+
        '<div class="tier"><span>★ COBRE MEMBER</span><b>'+Math.max(1,Math.round(state.points/50))+'%</b></div>'+
        '<div class="bar"><span style="width:'+Math.max(2,state.points/50)+'%"></span></div>'+
        '<div class="muted" style="font-size:12px">Faltam '+(5000-state.points)+' PTS para o nível Platinum</div></div>'+
        '<div class="quick"><div>'+ICON.gift+'MEUS<br>RESGATES</div><div>'+ICON.trend+'COMO<br>GANHAR</div></div>'+
        '<div class="sec"><h3>Últimas Movimentações</h3><a>VER TUDO</a></div>'+movs,
        {nav:true});
    },
    scan:function(){
      show(backHdr('Pagar na mesa','home')+
        '<div class="eyebrow gray">Passo 1 de 3</div><h1>Aponte para o QR da comanda</h1>'+
        '<p class="lead">Leia o QR do cartão que você recebeu na entrada.</p>'+
        '<div class="scan" id="scanbox"><video id="cam" playsinline autoplay muted hidden></video><div class="frame"><i></i><i></i><i></i><i></i></div>'+
        '<div class="comanda">SAN REMO<div class="n">Nº '+COMANDA+'</div></div>'+
        '<div class="scanline"></div><div class="status" id="scanst">Procurando comanda…</div></div>'+
        '<button class="link" data-go="conta">Digitar número da comanda</button>');
      var box = document.getElementById('scanbox');
      function found(){
        if(box.dataset.done) return; box.dataset.done='1';
        var s=document.getElementById('scanst'); if(s) s.textContent='Comanda Nº '+COMANDA+' encontrada ✓';
        timers.push(setTimeout(function(){go('conta')},900));
      }
      box.addEventListener('click',found);
      function fallback(){timers.push(setTimeout(found,1600))}
      if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(st){
          var v=document.getElementById('cam');
          if(!v){st.getTracks().forEach(function(t){t.stop()});return}
          stream=st; v.srcObject=st; v.hidden=false; box.classList.add('live');
          var p=v.play(); if(p&&p.catch) p.catch(function(){});
          timers.push(setTimeout(found,3500));
        }).catch(fallback);
      } else fallback();
    },
    conta:function(){
      var rows = ITEMS.map(function(i){
        return '<div class="item"><span class="qty">'+i.q+'x</span><div class="nm">'+i.n+'<span>'+i.d+'</span></div><span class="pr">'+brl(i.p)+'</span></div>';

      show(backHdr('Mesa '+MESA,'home')+
        '<div class="eyebrow gray">Passo 2 de 3 · Comanda Nº '+COMANDA+'</div><h1>Sua conta</h1>'+
        '<p class="lead">Confira os itens antes de pagar.</p>'+
        '<div class="card" style="padding:6px 18px">'+rows+'</div>'+
        '<div style="padding:16px 4px 0"><div class="sum"><span>Subtotal</span><span>'+brl(TOTAL)+'</span></div>'+
        '<div class="sum"><span>Taxa de serviço</span><span>R$ 0,00</span></div>'+
        '<div class="sum big"><span>Total</span><span>'+brl(TOTAL)+'</span></div></div>'+
        '<div class="earn"><span class="coin">+'+POINTS+'</span>Você ganha '+POINTS+' pontos com esta compra</div>'+
        '<button class="btn" data-go="metodo">Pagar '+brl(TOTAL)+'</button>');
    },
    metodo:function(){
      function m(id,ic,title,sub,tag){
        return '<button class="method'+(state.method===id?' sel':'')+'" data-m="'+id+'"><span class="mi">'+ic+'</span>'+
          '<span class="mt"><b>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</b><span>'+sub+'</span></span><span class="radio"></span></button>';
      }
      show(backHdr('Pagamento','conta')+
        '<div class="eyebrow gray">Passo 3 de 3</div><h1>Como você quer pagar?</h1>'+
        '<p class="lead">Total da mesa: <b style="color:var(--ink)">'+brl(TOTAL)+'</b></p>'+
        m('pix',ICON.pix,'Pix','Aprovação na hora','MAIS RÁPIDO')+
        m('credito',ICON.card,'Cartão de crédito','Visa •••• 2481')+
        m('debito',ICON.card,'Cartão de débito','Elo •••• 7730')+
        '<div style="height:10px"></div><button class="btn" id="pay">Confirmar pagamento</button>');
      root.querySelectorAll('[data-m]').forEach(function(b){
        b.addEventListener('click',function(){
          state.method=b.getAttribute('data-m');
          root.querySelectorAll('[data-m]').forEach(function(x){x.classList.toggle('sel',x===b)});
        });
      });
      document.getElementById('pay').addEventListener('click',function(){go(state.method==='pix'?'pix':'processando')});
    },
    pix:function(){
      show(backHdr('Pagar com Pix','metodo')+
        '<div class="center"><h1 style="font-size:24px">Escaneie ou copie o código</h1>'+
        '<p class="lead" style="margin-bottom:6px">'+brl(TOTAL)+' · Padaria San Remo</p>'+
        '<div class="qr">'+qrSVG()+'</div></div>'+
        '<div class="copy"><code>00020126580014br.gov.bcb.pix0136sanremo-mesa'+MESA+'-'+COMANDA+'</code><b>COPIAR</b></div>'+
        '<div class="wait"><span class="spin"></span>Aguardando pagamento…</div>'+
        '<button class="btn ghost" data-go="aprovado">Já paguei</button>');
      timers.push(setTimeout(function(){go('aprovado')},5000));
    },
    processando:function(){
      var c = state.method==='credito'?'Visa •••• 2481':'Elo •••• 7730';
      show('<div class="center proc"><span class="spin bigspin"></span><h1 style="font-size:24px">Processando pagamento</h1>'+
        '<p class="lead">'+brl(TOTAL)+' no '+c+'</p></div>',{cls:'center'});
      timers.push(setTimeout(function(){go('aprovado')},2300));
    },
    aprovado:function(){
      if(!state.paid){state.paid=true;state.points+=POINTS}
      var via = state.method==='pix'?'Pix':(state.method==='credito'?'Crédito •••• 2481':'Débito •••• 7730');
      show('<div class="center"><div class="ok">'+ICON.check+'</div>'+
        '<h1>Pagamento aprovado</h1><p class="lead">Obrigado! Bom resto de dia.</p>'+
        '<div class="liberado"><span class="gi">'+ICON.gate+'</span><div><b>Saída liberada</b><span>Sua comanda Nº '+COMANDA+' já pode passar na catraca.</span></div></div>'+
        '<div class="receipt"><div class="r"><span>Valor</span><b>'+brl(TOTAL)+'</b></div>'+
        '<div class="r"><span>Forma</span><b>'+via+'</b></div>'+
        '<div class="r"><span>Mesa</span><b>'+MESA+'</b></div>'+
        '<div class="r"><span>Pontos ganhos</span><b style="color:var(--green)">+'+POINTS+' PTS</b></div></div>'+
        '<button class="btn dark" data-go="cartao">Ver cartão de saída</button>'+
        '<button class="btn ghost" data-go="home">Voltar ao início</button></div>');
    },
    cartao:function(){
      show(backHdr('Cartão de saída','home')+
        '<div class="center"><div class="exitcard"><div class="brand">SAN REMO · COMANDA</div>'+
        '<div class="num">Nº '+COMANDA+'</div><div class="lbl">MESA '+MESA+' · '+brl(TOTAL)+' PAGO</div>'+
        '<div class="status-pill"><span class="dot"></span>LIBERADO PARA SAÍDA</div></div>'+
        '<div class="timer"><span class="muted" style="font-size:14px;font-weight:600">Liberação válida por</span><b id="cd">15:00</b></div>'+
        '<ul class="steps"><li><span>1</span>Vá até a catraca de saída</li><li><span>2</span>Aproxime sua comanda do leitor</li><li><span>3</span>Pronto, pode sair sem fila</li></ul>'+
        '<button class="btn" data-go="home">Concluir</button>'+
        '<button class="link" id="reset">Reiniciar demonstração</button></div>');
      var left = 900, el = document.getElementById('cd');
      window.__cd = setInterval(function(){
        left = Math.max(0,left-1);
        if(el) el.textContent = String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
      },1000);
      document.getElementById('reset').addEventListener('click',function(){state.paid=false;state.points=61;state.method='pix';go('home')});
    }
  };

  function go(name){(screens[name]||screens.home)()}

  nav.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){if(b.getAttribute('data-tab')==='inicio')go('home')});
  });

  function qrSVG(){
    var n=25,s=1,cells='',seed=187;
    function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
    function finder(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#141414"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#141414"/>'}
    for(var y=0;y<n;y++)for(var x=0;x<n;x++){
      var inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
      var inC=x>9&&x<15&&y>9&&y<15;
      if(!inF&&!inC&&rnd()>.5)cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#141414"/>';
    }
    var logo='<rect x="10" y="10" width="5" height="5" rx="1.2" fill="#f8c42c"/><text x="12.5" y="13.4" text-anchor="middle" font-size="2.6" font-weight="800" fill="#2a2000" font-family="sans-serif">SR</text>';
    return '<svg viewBox="0 0 25 25" shape-rendering="crispEdges"><rect width="25" height="25" fill="#fff"/>'+cells+finder(0,0)+finder(n-7,0)+finder(0,n-7)+logo+'</svg>';
  }

  go('home');
})();
</script>
